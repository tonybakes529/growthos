# Supabase CLI config (only the settings this project depends on; `supabase init` fills in the rest).
project_id = "growth-os"

[api]
enabled = true
port = 54321
# `app` holds the workflow RPCs. On hosted Supabase also add it under
# Project Settings → API → Exposed schemas.
schemas = ["public", "graphql_public", "app"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5GiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/invite"]
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false
